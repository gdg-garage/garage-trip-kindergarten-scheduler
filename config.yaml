schedule:
  days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri"]
  shift_blocks:
    - id: 0
      name: "Shift 1"
      start: "09:00"
      end: "11:00"
    - id: 1
      name: "Shift 2"
      start: "11:00"
      end: "13:00"
    - id: 2
      name: "Shift 3"
      start: "14:00"
      end: "16:00"
    - id: 3
      name: "Shift 4"
      start: "16:00"
      end: "18:00"
  parents_per_shift: 2
  parents_per_shift_by_day:
    Thu: 3
    Fri: 3
  disabled_shifts:
    - day: "Mon"
      shift_ids: [2, 3]  # Monday afternoon (Shifts 3 & 4) cancelled for Outdoor Puzzle Hunt
      reason: "OUTDOOR PUZZLE HUNT"
  locked_days: ["Sun", "Mon", "Tue", "Wed"]  # Freeze Sun-Wed, regenerate starting tomorrow (Thu-Fri)

constraints:
  max_shifts_per_day: 2
  disallow_consecutive_shifts: true
  couple_policy:
    early_week_disallow: true     # Sun-Tue: strict couple separation
    early_week_days: ["Sun", "Mon", "Tue"]
    late_week_preference_weight: 0 # Wed-Fri: 0 = neutral/allowed
  weights:
    fairness_weight: 100               # Minimize variance in shifts worked per available day
    pair_diversity_weight: 10          # Minimize repeated pairings of the same parent pair
    daily_balance_weight: 5            # Prefer 1 shift per day over 2 shifts where possible
    morning_evening_balance_weight: 15 # Balance morning (shifts 0,1) vs evening (shifts 2,3) per parent
    eva_avoidance_tie_weight: 1        # Tie-breaker to avoid over-scheduling Eva (has small child)

